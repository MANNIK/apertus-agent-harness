# GENERATO da scripts/build_regression_tasks.py (set di regressione general-v0.1, W13): non modificare a mano.
# Item proposti da Claude, risposte verificabili, controlli deterministici sul testo (nessun giudice AI). Da confermare dalla squadra.
- id: reg_train_arrival
  category: arithmetic
  prompt: A train leaves at 08:15 and the trip takes 2 hours and 50 minutes. At what time does it arrive? Answer in the format HH:MM.
  max_steps: 3
  meta:
    language: en
    split: regression_final
    capability: arithmetic
  checks:
  - type: final_regex
    pattern: \b11:05\b
- id: reg_notebooks
