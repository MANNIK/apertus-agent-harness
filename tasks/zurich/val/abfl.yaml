# GENERATO da scripts/build_zurich_tasks.py: non modificare a mano (le modifiche vanno nelle specifiche e si rigenera).
# Schema abfl, split val. Dati reali CC0 della Città di Zurigo (data/zurich/, vedi docs/dati.md).
# Domande e query gold scritte da Claude (strumento di sviluppo), verificate eseguendo il gold; formulazioni NON riviste da madrelingua.
- id: abfl_waste_month_1
  category: lookup
  prompt: How many tonnes of municipal waste were collected in November 2023?
  tools:
  - run_sql
  setup: &id001
    sql_init:
    - CREATE TABLE stadtreinigung_kennzahlen AS SELECT * FROM read_csv('{DATA}/zurich/erz_sr_kennzahlen.csv', header=true, sample_size=-1)
  max_steps: 6
  meta:
    language: en
    schema_id: abfl
    dataset: erz_sr_kennzahlen
    split: val
    group: erz
    template: waste_month
    trap: trailing_whitespace
  checks:
  - type: sql_result_match
    gold: SELECT Wert FROM stadtreinigung_kennzahlen WHERE Intervall = 'monatlich' AND TRIM(Indikator) = 'Siedlungsabfall' AND year(Datum) = 2023 AND month(Datum) = 11
  - type: sql_result_projection
    gold: SELECT Wert FROM stadtreinigung_kennzahlen WHERE Intervall = 'monatlich' AND TRIM(Indikator) = 'Siedlungsabfall' AND year(Datum) = 2023 AND month(Datum) = 11
    diagnostic: true
  - type: final_number
    value: 428.0
    tol: 0.0
    diagnostic: true
