- id: eink_spread_1
  category: arithmetic
  prompt: Qual era nel 2007 nel quartiere Witikon, con la tariffa base, la differenza tra il 75° e il 25° percentile del reddito (in migliaia di franchi)?
  tools:
  - run_sql
  setup: *id001
  max_steps: 6
  meta:
    language: it
    schema_id: eink
    dataset: fd_median_einkommen_quartier_od1003
    split: val
    group: fd
    template: spread
  checks:
  - type: sql_result_match
    gold: SELECT ROUND(SteuerEinkommen_p75 - SteuerEinkommen_p25, 1) FROM einkommen_quartier WHERE QuarLang = 'Witikon' AND StichtagDatJahr = 2007 AND SteuerTarifLang = 'Grundtarif'
  - type: sql_result_projection
    gold: SELECT ROUND(SteuerEinkommen_p75 - SteuerEinkommen_p25, 1) FROM einkommen_quartier WHERE QuarLang = 'Witikon' AND StichtagDatJahr = 2007 AND SteuerTarifLang = 'Grundtarif'
    diagnostic: true
  - type: final_number
    value: 52.5
    tol: 0.06
    diagnostic: true
