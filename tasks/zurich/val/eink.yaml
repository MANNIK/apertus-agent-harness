- id: eink_married_vs_basic_1
  category: arithmetic
  prompt: Um wie viel war im Jahr 2006 im Quartier Seebach das Median-Einkommen beim Verheiratetentarif höher als beim Grundtarif (in Tausend Franken)?
  tools:
  - run_sql
  setup: *id001
  max_steps: 6
  meta:
    language: de
    schema_id: eink
    dataset: fd_median_einkommen_quartier_od1003
    split: val
    group: fd
    template: married_vs_basic
  checks:
  - type: sql_result_match
    gold: SELECT ROUND((SELECT SteuerEinkommen_p50 FROM einkommen_quartier WHERE QuarLang = 'Seebach' AND StichtagDatJahr = 2006 AND SteuerTarifLang = 'Verheiratetentarif') - (SELECT SteuerEinkommen_p50 FROM einkommen_quartier WHERE QuarLang = 'Seebach' AND StichtagDatJahr = 2006 AND SteuerTarifLang = 'Grundtarif'), 1)
  - type: sql_result_projection
    gold: SELECT ROUND((SELECT SteuerEinkommen_p50 FROM einkommen_quartier WHERE QuarLang = 'Seebach' AND StichtagDatJahr = 2006 AND SteuerTarifLang = 'Verheiratetentarif') - (SELECT SteuerEinkommen_p50 FROM einkommen_quartier WHERE QuarLang = 'Seebach' AND StichtagDatJahr = 2006 AND SteuerTarifLang = 'Grundtarif'), 1)
    diagnostic: true
  - type: final_number
    value: 24.9
    tol: 0.06
    diagnostic: true
