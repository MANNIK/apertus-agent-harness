- id: eink_highest_quarter_1
  category: argmax
  prompt: Which district had the highest median income under the basic tariff (Grundtarif) in 2011?
  tools:
  - run_sql
  setup: *id001
  max_steps: 6
  meta:
    language: en
    schema_id: eink
    dataset: fd_median_einkommen_quartier_od1003
    split: val
    group: fd
    template: highest_quarter
  checks:
  - type: sql_result_match
    gold: SELECT QuarLang FROM einkommen_quartier WHERE StichtagDatJahr = 2011 AND SteuerTarifLang = 'Grundtarif' AND SteuerEinkommen_p50 IS NOT NULL ORDER BY SteuerEinkommen_p50 DESC, QuarLang LIMIT 1
  - type: sql_result_projection
    gold: SELECT QuarLang FROM einkommen_quartier WHERE StichtagDatJahr = 2011 AND SteuerTarifLang = 'Grundtarif' AND SteuerEinkommen_p50 IS NOT NULL ORDER BY SteuerEinkommen_p50 DESC, QuarLang LIMIT 1
    diagnostic: true
