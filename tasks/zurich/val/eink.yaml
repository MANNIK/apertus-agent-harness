# GENERATO da scripts/build_zurich_tasks.py: non modificare a mano (le modifiche vanno nelle specifiche e si rigenera).
# Schema eink, split val. Dati reali CC0 della Città di Zurigo (data/zurich/, vedi docs/dati.md).
# Domande e query gold scritte da Claude (strumento di sviluppo), verificate eseguendo il gold; formulazioni NON riviste da madrelingua.
- id: eink_median_income_1
  category: lookup
  prompt: Wie hoch war im Jahr 2008 das mittlere (Median-)Einkommen im Quartier Schwamendingen-Mitte beim Tarif «Einelternfamilientarif» (in Tausend Franken)?
  tools:
  - run_sql
  setup: &id001
    sql_init:
    - CREATE TABLE einkommen_quartier AS SELECT * FROM read_csv('{DATA}/zurich/fd_median_einkommen_quartier_od1003.csv', header=true, sample_size=-1)
  max_steps: 6
  meta:
    language: de
    schema_id: eink
    dataset: fd_median_einkommen_quartier_od1003
    split: val
    group: fd
    template: median_income
    trap: cross_lingual_schema
  checks:
  - type: sql_result_match
    gold: SELECT SteuerEinkommen_p50 FROM einkommen_quartier WHERE QuarLang = 'Schwamendingen-Mitte' AND StichtagDatJahr = 2008 AND SteuerTarifLang = 'Einelternfamilientarif'
  - type: sql_result_projection
    gold: SELECT SteuerEinkommen_p50 FROM einkommen_quartier WHERE QuarLang = 'Schwamendingen-Mitte' AND StichtagDatJahr = 2008 AND SteuerTarifLang = 'Einelternfamilientarif'
    diagnostic: true
  - type: final_number
    value: 25.75
    tol: 0.06
    diagnostic: true
