- id: motg_highest_1
  category: argmax
  prompt: In welchem Quartier war der Motorisierungsgrad im Jahr 2014 am höchsten?
  tools:
  - run_sql
  setup: *id001
  max_steps: 6
  meta:
    language: de
    schema_id: motg
    dataset: prd_ssz_fz_motorisierungsgrad_jahr_quartier_od2005
    split: dev
    group: prd
    template: highest
  checks:
  - type: sql_result_match
    gold: SELECT QuarLang FROM motorisierungsgrad WHERE StichtagDatJahr = 2014 ORDER BY Motorisierungsgrad DESC, QuarLang LIMIT 1
  - type: sql_result_projection
    gold: SELECT QuarLang FROM motorisierungsgrad WHERE StichtagDatJahr = 2014 ORDER BY Motorisierungsgrad DESC, QuarLang LIMIT 1
    diagnostic: true
