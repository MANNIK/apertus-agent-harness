# GENERATO da scripts/build_zurich_tasks.py: non modificare a mano (le modifiche vanno nelle specifiche e si rigenera).
# Schema motg, split dev. Dati reali CC0 della Città di Zurigo (data/zurich/, vedi docs/dati.md).
# Domande e query gold scritte da Claude (strumento di sviluppo), verificate eseguendo il gold; formulazioni NON riviste da madrelingua.
- id: motg_rate_1
  category: lookup
  prompt: Quel était le taux de motorisation (voitures pour 1000 habitants) dans le quartier Saatlen en 2008, arrondi à une décimale ?
  tools:
  - run_sql
  setup: &id001
    sql_init:
    - CREATE TABLE motorisierungsgrad AS SELECT * FROM read_csv('{DATA}/zurich/prd_ssz_fz_motorisierungsgrad_jahr_quartier_od2005.csv', header=true, sample_size=-1)
  max_steps: 6
  meta:
    language: fr
    schema_id: motg
    dataset: prd_ssz_fz_motorisierungsgrad_jahr_quartier_od2005
    split: dev
    group: prd
    template: rate
    trap: cross_lingual_schema
  checks:
  - type: sql_result_match
    gold: SELECT ROUND(Motorisierungsgrad, 1) FROM motorisierungsgrad WHERE QuarLang = 'Saatlen' AND StichtagDatJahr = 2008
  - type: sql_result_projection
    gold: SELECT ROUND(Motorisierungsgrad, 1) FROM motorisierungsgrad WHERE QuarLang = 'Saatlen' AND StichtagDatJahr = 2008
    diagnostic: true
  - type: final_number
    value: 323.9
    tol: 0.06
    diagnostic: true
