- id: miet_median_rent_1
  category: lookup
  prompt: Quel était en 2024 le loyer net médian (par logement) des appartements de 3 pièces non d'utilité publique à « Kreis 3 » ?
  tools:
  - run_sql
  setup: &id001
    sql_init:
    - CREATE TABLE mietpreise AS SELECT * FROM read_csv('{DATA}/zurich/bau_whg_mpe_mietpreis_raum_zizahl_gn_jahr_od5161.csv', header=true, sample_size=-1)
  max_steps: 6
  meta:
    language: fr
    schema_id: miet
    dataset: bau_whg_mpe_mietpreis_raum_zizahl_gn_jahr_od5161
    split: dev
    group: bau
    template: median_rent
    trap: domain_codes
  checks:
  - type: sql_result_match
    gold: SELECT qu50 FROM mietpreise WHERE GliederungLang = 'Kreis 3' AND StichtagDatJahr = 2024 AND ZimmerLang = '3 Zimmer' AND GemeinnuetzigLang = 'Nicht gemeinnützig' AND EinheitLang = 'Wohnung' AND PreisartLang = 'netto'
  - type: sql_result_projection
    gold: SELECT qu50 FROM mietpreise WHERE GliederungLang = 'Kreis 3' AND StichtagDatJahr = 2024 AND ZimmerLang = '3 Zimmer' AND GemeinnuetzigLang = 'Nicht gemeinnützig' AND EinheitLang = 'Wohnung' AND PreisartLang = 'netto'
    diagnostic: true
  - type: final_number
    value: 1760.0
    tol: 0.0
    diagnostic: true
