# GENERATO da scripts/build_zurich_tasks.py: non modificare a mano (le modifiche vanno nelle specifiche e si rigenera).
# Schema bevc, split dev. Dati reali CC0 della Città di Zurigo (data/zurich/, vedi docs/dati.md).
# Domande e query gold scritte da Claude (strumento di sviluppo), verificate eseguendo il gold; formulazioni NON riviste da madrelingua.
- id: bevc_members_1
  category: lookup
  prompt: Combien de personnes appartenaient à la confession « Andere, ohne, unbekannt » en 1991 ?
  tools:
  - run_sql
  setup: &id001
    sql_init:
    - CREATE TABLE bevoelkerung_konfession AS SELECT * FROM read_csv('{DATA}/zurich/bev_bestand_jahr_konfession_od3160.csv', header=true, sample_size=-1)
  max_steps: 6
  meta:
    language: fr
    schema_id: bevc
    dataset: bev_bestand_jahr_konfession_od3160
    split: dev
    group: bev
    template: members
  checks:
  - type: sql_result_match
    gold: SELECT AnzBestWir FROM bevoelkerung_konfession WHERE Kon2AggLang_noDM = 'Andere, ohne, unbekannt' AND StichtagDatJahr = 1991
  - type: sql_result_projection
    gold: SELECT AnzBestWir FROM bevoelkerung_konfession WHERE Kon2AggLang_noDM = 'Andere, ohne, unbekannt' AND StichtagDatJahr = 1991
    diagnostic: true
  - type: final_number
    value: 81839.0
    tol: 0.0
    diagnostic: true
