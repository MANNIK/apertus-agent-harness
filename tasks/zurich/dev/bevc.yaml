- id: bevc_share_1
  category: arithmetic
  prompt: Qual era nel 2005 la quota della confessione «Römisch-Katholisch» sul totale dei registrati, in percentuale arrotondata a un decimale?
  tools:
  - run_sql
  setup: *id001
  max_steps: 6
  meta:
    language: it
    schema_id: bevc
    dataset: bev_bestand_jahr_konfession_od3160
    split: dev
    group: bev
    template: share
  checks:
  - type: sql_result_match
    gold: SELECT ROUND(100.0 * SUM(CASE WHEN Kon2AggLang_noDM = 'Römisch-Katholisch' THEN AnzBestWir END) / SUM(AnzBestWir), 1) FROM bevoelkerung_konfession WHERE StichtagDatJahr = 2005
  - type: sql_result_projection
    gold: SELECT ROUND(100.0 * SUM(CASE WHEN Kon2AggLang_noDM = 'Römisch-Katholisch' THEN AnzBestWir END) / SUM(AnzBestWir), 1) FROM bevoelkerung_konfession WHERE StichtagDatJahr = 2005
    diagnostic: true
  - type: final_number
    value: 32.7
    tol: 0.06
    diagnostic: true
