- id: sozh_highest_rate_1
  category: argmax
  prompt: In which district was the social-assistance rate highest in 2004?
  tools:
  - run_sql
  setup: *id001
  max_steps: 6
  meta:
    language: en
    schema_id: sozh
    dataset: sd_sod_sozialhilfequote_stadtquartier
    split: dev
    group: sd
    template: highest_rate
    trap: text_numbers
  checks:
  - type: sql_result_match
    gold: SELECT Raum FROM sozialhilfequote WHERE Jahr = 2004 AND TRY_CAST(SH_Quote AS DOUBLE) IS NOT NULL ORDER BY TRY_CAST(SH_Quote AS DOUBLE) DESC, Raum LIMIT 1
