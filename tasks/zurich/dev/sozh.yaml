# GENERATO da scripts/build_zurich_tasks.py: non modificare a mano (le modifiche vanno nelle specifiche e si rigenera).
# Schema sozh, split dev. Dati reali CC0 della Città di Zurigo (data/zurich/, vedi docs/dati.md).
# Domande e query gold scritte da Claude (strumento di sviluppo), verificate eseguendo il gold; formulazioni NON riviste da madrelingua.
- id: sozh_recipients_1
  category: lookup
  prompt: Combien de personnes ont perçu l'aide sociale en 2004 dans le quartier Hard ?
  tools:
  - run_sql
  setup: &id001
    sql_init:
    - CREATE TABLE sozialhilfequote AS SELECT * FROM read_csv('{DATA}/zurich/sd_sod_sozialhilfequote_stadtquartier.csv', header=true, sample_size=-1)
  max_steps: 6
  meta:
    language: fr
    schema_id: sozh
    dataset: sd_sod_sozialhilfequote_stadtquartier
    split: dev
    group: sd
    template: recipients
    trap: cross_lingual_schema
  checks:
  - type: sql_result_match
    gold: SELECT SH_Beziehende FROM sozialhilfequote WHERE Raum = 'Hard' AND Jahr = 2004
  - type: final_number
    value: 1134.0
    tol: 0.0
