# GENERATO da scripts/build_zurich_tasks.py: non modificare a mano (le modifiche vanno nelle specifiche e si rigenera).
# Schema whgz, split dev. Dati reali CC0 della Città di Zurigo (data/zurich/, vedi docs/dati.md).
# Domande e query gold scritte da Claude (strumento di sviluppo), verificate eseguendo il gold; formulazioni NON riviste da madrelingua.
- id: whgz_count_type_1
  category: lookup
  prompt: Combien de logements de type « 2-Zimmer » comptait le parc en 1995 ?
  tools:
  - run_sql
  setup: &id001
    sql_init:
    - CREATE TABLE wohnungen_nach_zimmerzahl AS SELECT * FROM read_csv('{DATA}/zurich/bau_best_whg_zizahl_jahr_od5062.csv', header=true, sample_size=-1)
  max_steps: 6
  meta:
    language: fr
    schema_id: whgz
    dataset: bau_best_whg_zizahl_jahr_od5062
    split: dev
    group: bau
    template: count_type
  checks:
  - type: sql_result_match
    gold: SELECT AnzWhgStat FROM wohnungen_nach_zimmerzahl WHERE AnzZimmerLevel2Lang_noDM = '2-Zimmer' AND StichtagDatJahr = 1995
  - type: sql_result_projection
    gold: SELECT AnzWhgStat FROM wohnungen_nach_zimmerzahl WHERE AnzZimmerLevel2Lang_noDM = '2-Zimmer' AND StichtagDatJahr = 1995
    diagnostic: true
  - type: final_number
    value: 40190.0
    tol: 0.0
    diagnostic: true
