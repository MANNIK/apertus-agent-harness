- id: whgz_largest_type_1
  category: argmax
  prompt: Which room-count category had the most apartments in 2003?
  tools:
  - run_sql
  setup: *id001
  max_steps: 6
  meta:
    language: en
    schema_id: whgz
    dataset: bau_best_whg_zizahl_jahr_od5062
    split: dev
    group: bau
    template: largest_type
  checks:
  - type: sql_result_match
    gold: SELECT AnzZimmerLevel2Lang_noDM FROM wohnungen_nach_zimmerzahl WHERE StichtagDatJahr = 2003 ORDER BY AnzWhgStat DESC, AnzZimmerLevel2Lang_noDM LIMIT 1
  - type: sql_result_projection
    gold: SELECT AnzZimmerLevel2Lang_noDM FROM wohnungen_nach_zimmerzahl WHERE StichtagDatJahr = 2003 ORDER BY AnzWhgStat DESC, AnzZimmerLevel2Lang_noDM LIMIT 1
    diagnostic: true
