- id: whgz_growth_1
  category: arithmetic
  prompt: Di quanti alloggi della categoria «2-Zimmer» è cresciuto il parco tra il 1956 e il 1976 (valore 1976 meno valore 1956)?
  tools:
  - run_sql
  setup: *id001
  max_steps: 6
  meta:
    language: it
    schema_id: whgz
    dataset: bau_best_whg_zizahl_jahr_od5062
    split: dev
    group: bau
    template: growth
  checks:
  - type: sql_result_match
    gold: SELECT (SELECT AnzWhgStat FROM wohnungen_nach_zimmerzahl WHERE AnzZimmerLevel2Lang_noDM = '2-Zimmer' AND StichtagDatJahr = 1976) - (SELECT AnzWhgStat FROM wohnungen_nach_zimmerzahl WHERE AnzZimmerLevel2Lang_noDM = '2-Zimmer' AND StichtagDatJahr = 1956)
  - type: sql_result_projection
    gold: SELECT (SELECT AnzWhgStat FROM wohnungen_nach_zimmerzahl WHERE AnzZimmerLevel2Lang_noDM = '2-Zimmer' AND StichtagDatJahr = 1976) - (SELECT AnzWhgStat FROM wohnungen_nach_zimmerzahl WHERE AnzZimmerLevel2Lang_noDM = '2-Zimmer' AND StichtagDatJahr = 1956)
    diagnostic: true
  - type: final_number
    value: 8117.0
    tol: 0.0
    diagnostic: true
