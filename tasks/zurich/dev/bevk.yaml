- id: bevk_above_city_avg_1
  category: subquery
  prompt: Quali distretti avevano nel 2020 più abitanti della media di tutti i distretti? Indicali in ordine alfabetico.
  tools:
  - run_sql
  setup: *id001
  max_steps: 6
  meta:
    language: it
    schema_id: bevk
    dataset: bev_bestand_jahr_kreis_od3242
    split: dev
    group: bev
    template: above_city_avg
  checks:
  - type: sql_result_match
    gold: SELECT KreisLang FROM bevoelkerung_kreis WHERE StichtagDatJahr = 2020 AND AnzBestWir > (SELECT AVG(AnzBestWir) FROM bevoelkerung_kreis WHERE StichtagDatJahr = 2020) ORDER BY KreisLang
    order_matters: true
  - type: sql_result_projection
    gold: SELECT KreisLang FROM bevoelkerung_kreis WHERE StichtagDatJahr = 2020 AND AnzBestWir > (SELECT AVG(AnzBestWir) FROM bevoelkerung_kreis WHERE StichtagDatJahr = 2020) ORDER BY KreisLang
    diagnostic: true
    order_matters: true
