- id: bevk_avg_period_1
  category: aggregation
  prompt: Wie hoch war die durchschnittliche Einwohnerzahl von Kreis 3 in den Jahren 1995 bis 2004 (beide eingeschlossen), auf eine ganze Zahl gerundet?
  tools:
  - run_sql
  setup: *id001
  max_steps: 6
  meta:
    language: de
    schema_id: bevk
    dataset: bev_bestand_jahr_kreis_od3242
    split: dev
    group: bev
    template: avg_period
  checks:
  - type: sql_result_match
    gold: SELECT ROUND(AVG(AnzBestWir)) FROM bevoelkerung_kreis WHERE KreisLang = 'Kreis 3' AND StichtagDatJahr BETWEEN 1995 AND 2004
  - type: sql_result_projection
    gold: SELECT ROUND(AVG(AnzBestWir)) FROM bevoelkerung_kreis WHERE KreisLang = 'Kreis 3' AND StichtagDatJahr BETWEEN 1995 AND 2004
    diagnostic: true
  - type: final_number
    value: 45824.0
    tol: 0.0
    diagnostic: true
