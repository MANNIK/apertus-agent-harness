# GENERATO da scripts/build_zurich_tasks.py: non modificare a mano (le modifiche vanno nelle specifiche e si rigenera).
# Schema bevk, split dev. Dati reali CC0 della Città di Zurigo (data/zurich/, vedi docs/dati.md).
# Domande e query gold scritte da Claude (strumento di sviluppo), verificate eseguendo il gold; formulazioni NON riviste da madrelingua.
- id: bevk_pop_1
  category: lookup
  prompt: Quanti abitanti aveva Kreis 4 nel 2020?
  tools:
  - run_sql
  setup: &id001
    sql_init:
    - CREATE TABLE bevoelkerung_kreis AS SELECT * FROM read_csv('{DATA}/zurich/bev_bestand_jahr_kreis_od3242.csv', header=true, sample_size=-1)
  max_steps: 6
  meta:
    language: it
    schema_id: bevk
    dataset: bev_bestand_jahr_kreis_od3242
    split: dev
    group: bev
    template: pop
  checks:
  - type: sql_result_match
    gold: SELECT AnzBestWir FROM bevoelkerung_kreis WHERE KreisLang = 'Kreis 4' AND StichtagDatJahr = 2020
  - type: sql_result_projection
    gold: SELECT AnzBestWir FROM bevoelkerung_kreis WHERE KreisLang = 'Kreis 4' AND StichtagDatJahr = 2020
    diagnostic: true
  - type: final_number
    value: 29034.0
    tol: 0.0
    diagnostic: true
