# GENERATO da scripts/build_zurich_tasks.py: non modificare a mano (le modifiche vanno nelle specifiche e si rigenera).
# Schema bevq, split dev. Dati reali CC0 della Città di Zurigo (data/zurich/, vedi docs/dati.md).
# Domande e query gold scritte da Claude (strumento di sviluppo), verificate eseguendo il gold; formulazioni NON riviste da madrelingua.
- id: bevq_pop_1
  category: lookup
  prompt: Wie viele Personen wohnten im Jahr 2002 im Quartier Sihlfeld?
  tools:
  - run_sql
  setup: &id001
    sql_init:
    - CREATE TABLE bevoelkerung_quartier AS SELECT * FROM read_csv('{DATA}/zurich/bev_bestand_jahr_quartier_od3240.csv', header=true, sample_size=-1)
  max_steps: 6
  meta:
    language: de
    schema_id: bevq
    dataset: bev_bestand_jahr_quartier_od3240
    split: dev
    group: bev
    template: pop
    trap: cross_lingual_schema
  checks:
  - type: sql_result_match
    gold: SELECT AnzBestWir FROM bevoelkerung_quartier WHERE QuarLang = 'Sihlfeld' AND StichtagDatJahr = 2002
  - type: sql_result_projection
    gold: SELECT AnzBestWir FROM bevoelkerung_quartier WHERE QuarLang = 'Sihlfeld' AND StichtagDatJahr = 2002
    diagnostic: true
  - type: final_number
    value: 20731.0
    tol: 0.0
    diagnostic: true
