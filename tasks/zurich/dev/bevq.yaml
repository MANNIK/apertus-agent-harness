- id: bevq_change_1
  category: arithmetic
  prompt: De combien de personnes la population du quartier City a-t-elle varié entre 1995 et 2005 (valeur 2005 moins valeur 1995) ?
  tools:
  - run_sql
  setup: *id001
  max_steps: 6
  meta:
    language: fr
    schema_id: bevq
    dataset: bev_bestand_jahr_quartier_od3240
    split: dev
    group: bev
    template: change
  checks:
  - type: sql_result_match
    gold: SELECT (SELECT AnzBestWir FROM bevoelkerung_quartier WHERE QuarLang = 'City' AND StichtagDatJahr = 2005) - (SELECT AnzBestWir FROM bevoelkerung_quartier WHERE QuarLang = 'City' AND StichtagDatJahr = 1995)
  - type: sql_result_projection
    gold: SELECT (SELECT AnzBestWir FROM bevoelkerung_quartier WHERE QuarLang = 'City' AND StichtagDatJahr = 2005) - (SELECT AnzBestWir FROM bevoelkerung_quartier WHERE QuarLang = 'City' AND StichtagDatJahr = 1995)
    diagnostic: true
  - type: final_number
    value: -161.0
    tol: 0.0
    diagnostic: true
