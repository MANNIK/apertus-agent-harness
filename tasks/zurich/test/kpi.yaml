# GENERATO da scripts/build_zurich_tasks.py: non modificare a mano (le modifiche vanno nelle specifiche e si rigenera).
# Schema kpi, split test. Dati reali CC0 della Città di Zurigo (data/zurich/, vedi docs/dati.md).
# Domande e query gold scritte da Claude (strumento di sviluppo), verificate eseguendo il gold; formulazioni NON riviste da madrelingua.
- id: kpi_index_value_1
  category: lookup
  prompt: Qual era l'indice totale dei prezzi al consumo di Zurigo nel mese di maggio 2015, con dicembre 2010 = 100?
  tools:
  - run_sql
  setup: &id001
    sql_init:
    - CREATE TABLE konsumentenpreise AS SELECT * FROM read_csv('{DATA}/zurich/wir_preise_zik_totalindex_monatswerte_od6001.csv', header=true, sample_size=-1)
  max_steps: 6
  meta:
    language: it
    schema_id: kpi
    dataset: wir_preise_zik_totalindex_monatswerte_od6001
    split: test
    group: wir
    template: index_value
    trap: multiple_bases
  checks:
  - type: sql_result_match
    gold: SELECT Indexstand_noDM FROM konsumentenpreise WHERE year(Basis_noDM) = 2010 AND month(Basis_noDM) = 12 AND year(Datum_noDM) = 2015 AND month(Datum_noDM) = 5
  - type: sql_result_projection
    gold: SELECT Indexstand_noDM FROM konsumentenpreise WHERE year(Basis_noDM) = 2010 AND month(Basis_noDM) = 12 AND year(Datum_noDM) = 2015 AND month(Datum_noDM) = 5
    diagnostic: true
  - type: final_number
    value: 98.7295
    tol: 0.06
    diagnostic: true
