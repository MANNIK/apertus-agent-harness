- id: kpi_inflation_1
  category: arithmetic
  prompt: De combien de pour cent l'indice total (base décembre 2015 = 100) a-t-il augmenté entre décembre 2022 et décembre 2025, arrondi à une décimale ?
  tools:
  - run_sql
  setup: *id001
  max_steps: 6
  meta:
    language: fr
    schema_id: kpi
    dataset: wir_preise_zik_totalindex_monatswerte_od6001
    split: test
    group: wir
    template: inflation
    trap: multiple_bases
  checks:
  - type: sql_result_match
    gold: SELECT ROUND(100.0 * ((SELECT Indexstand_noDM FROM konsumentenpreise WHERE year(Basis_noDM) = 2015 AND month(Basis_noDM) = 12 AND year(Datum_noDM) = 2025 AND month(Datum_noDM) = 12) / (SELECT Indexstand_noDM FROM konsumentenpreise WHERE year(Basis_noDM) = 2015 AND month(Basis_noDM) = 12 AND year(Datum_noDM) = 2022 AND month(Datum_noDM) = 12) - 1), 1)
  - type: sql_result_projection
    gold: SELECT ROUND(100.0 * ((SELECT Indexstand_noDM FROM konsumentenpreise WHERE year(Basis_noDM) = 2015 AND month(Basis_noDM) = 12 AND year(Datum_noDM) = 2025 AND month(Datum_noDM) = 12) / (SELECT Indexstand_noDM FROM konsumentenpreise WHERE year(Basis_noDM) = 2015 AND month(Basis_noDM) = 12 AND year(Datum_noDM) = 2022 AND month(Datum_noDM) = 12) - 1), 1)
    diagnostic: true
  - type: final_number
    value: 2.4
    tol: 0.06
    diagnostic: true
