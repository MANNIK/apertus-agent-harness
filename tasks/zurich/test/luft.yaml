- id: luft_worst_station_1
  category: argmax
  prompt: À quelle station la moyenne annuelle de NO2 était-elle la plus élevée en 2025 ?
  tools:
  - run_sql
  setup: *id001
  max_steps: 6
  meta:
    language: fr
    schema_id: luft
    dataset: ugz_luftschadstoffmessung_tageswerte
    split: test
    group: ugz
    template: worst_station
    trap: text_numbers
  checks:
  - type: sql_result_match
    gold: SELECT Standort FROM luftqualitaet WHERE Parameter = 'NO2' AND TRY_CAST(Wert AS DOUBLE) IS NOT NULL GROUP BY Standort ORDER BY AVG(TRY_CAST(Wert AS DOUBLE)) DESC, Standort LIMIT 1
