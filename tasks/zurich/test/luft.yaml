# GENERATO da scripts/build_zurich_tasks.py: non modificare a mano (le modifiche vanno nelle specifiche e si rigenera).
# Schema luft, split test. Dati reali CC0 della Città di Zurigo (data/zurich/, vedi docs/dati.md).
# Domande e query gold scritte da Claude (strumento di sviluppo), verificate eseguendo il gold; formulazioni NON riviste da madrelingua.
- id: luft_monthly_mean_1
  category: aggregation
  prompt: Quelle était la moyenne mensuelle de NO2 au mois de janvier 2025 à la station Zch_Schimmelstrasse (moyenne des valeurs journalières, arrondie à une décimale) ?
  tools:
  - run_sql
  setup: &id001
    sql_init:
    - 'CREATE TABLE luftqualitaet AS SELECT * REPLACE (CAST(substr(Datum, 1, 10) AS DATE) AS Datum) FROM read_csv(''{DATA}/zurich/ugz_luftschadstoffmessung_tageswerte.csv'', header=true, sample_size=-1, types={''Datum'': ''VARCHAR''})'
  max_steps: 6
  meta:
    language: fr
    schema_id: luft
    dataset: ugz_luftschadstoffmessung_tageswerte
    split: test
    group: ugz
    template: monthly_mean
    trap: text_numbers
  checks:
  - type: sql_result_match
    gold: SELECT ROUND(AVG(TRY_CAST(Wert AS DOUBLE)), 1) FROM luftqualitaet WHERE Standort = 'Zch_Schimmelstrasse' AND Parameter = 'NO2' AND month(Datum) = 1
  - type: final_number
    value: 30.2
    tol: 0.06
