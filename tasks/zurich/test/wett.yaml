- id: wett_hottest_day_1
  category: argmax
  prompt: In quale data è stata misurata nel 2025 alla stazione Zch_Schimmelstrasse la temperatura massima più alta (parametro T_max_h1)?
  tools:
  - run_sql
  setup: *id001
  max_steps: 6
  meta:
    language: it
    schema_id: wett
    dataset: ugz_meteodaten_tagesmittelwerte
    split: test
    group: ugz
    template: hottest_day
    trap: text_numbers
  checks:
  - type: sql_result_match
    gold: SELECT Datum FROM meteo WHERE Standort = 'Zch_Schimmelstrasse' AND Parameter = 'T_max_h1' AND TRY_CAST(Wert AS DOUBLE) IS NOT NULL ORDER BY TRY_CAST(Wert AS DOUBLE) DESC, Datum LIMIT 1
