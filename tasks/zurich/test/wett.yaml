# GENERATO da scripts/build_zurich_tasks.py: non modificare a mano (le modifiche vanno nelle specifiche e si rigenera).
# Schema wett, split test. Dati reali CC0 della Città di Zurigo (data/zurich/, vedi docs/dati.md).
# Domande e query gold scritte da Claude (strumento di sviluppo), verificate eseguendo il gold; formulazioni NON riviste da madrelingua.
- id: wett_monthly_temp_1
  category: aggregation
  prompt: What was the mean temperature in March 2025 at the station Zch_Schimmelstrasse (average of the daily values of parameter T, rounded to one decimal)?
  tools:
  - run_sql
  setup: &id001
    sql_init:
    - 'CREATE TABLE meteo AS SELECT * REPLACE (CAST(substr(Datum, 1, 10) AS DATE) AS Datum) FROM read_csv(''{DATA}/zurich/ugz_meteodaten_tagesmittelwerte.csv'', header=true, sample_size=-1, types={''Datum'': ''VARCHAR''})'
  max_steps: 6
  meta:
    language: en
    schema_id: wett
    dataset: ugz_meteodaten_tagesmittelwerte
    split: test
    group: ugz
    template: monthly_temp
    trap: text_numbers
  checks:
  - type: sql_result_match
    gold: SELECT ROUND(AVG(TRY_CAST(Wert AS DOUBLE)), 1) FROM meteo WHERE Standort = 'Zch_Schimmelstrasse' AND Parameter = 'T' AND month(Datum) = 3
  - type: final_number
    value: 8.7
    tol: 0.06
