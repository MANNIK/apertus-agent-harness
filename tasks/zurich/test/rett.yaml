# GENERATO da scripts/build_zurich_tasks.py: non modificare a mano (le modifiche vanno nelle specifiche e si rigenera).
# Schema rett, split test. Dati reali CC0 della Città di Zurigo (data/zurich/, vedi docs/dati.md).
# Domande e query gold scritte da Claude (strumento di sviluppo), verificate eseguendo il gold; formulazioni NON riviste da madrelingua.
- id: rett_missions_1
  category: aggregation
  prompt: Quanti interventi del servizio di soccorso sono stati registrati nel 2009 nel Kreis 7 (interventi fino a 10 minuti più interventi oltre 10 minuti)?
  tools:
  - run_sql
  setup: &id001
    sql_init:
    - CREATE TABLE rettungsdienst_hilfsfristen AS SELECT * FROM read_csv('{DATA}/zurich/sid_srz_od1036_hilfsfristen_rettungsdienste_jahr_stadtkreis.csv', header=true, sample_size=-1)
  max_steps: 6
  meta:
    language: it
    schema_id: rett
    dataset: sid_srz_od1036_hilfsfristen_rettungsdienste_jahr_stadtkreis
    split: test
    group: sid
    template: missions
  checks:
  - type: sql_result_match
    gold: SELECT Anzahl_Einsaetze_bis_10min + Anzahl_Einsaetze_groesser_10min FROM rettungsdienst_hilfsfristen WHERE Stadtkreis = 'Kreis 7' AND Jahr = 2009
  - type: final_number
    value: 236.0
    tol: 0.0
