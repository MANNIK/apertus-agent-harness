- id: rett_citywide_15_1
  category: arithmetic
  prompt: Wie hoch war im Jahr 2013 stadtweit der Anteil der Einsätze mit Hilfsfrist bis 15 Minuten, in Prozent auf eine Dezimalstelle gerundet (aus den Einsatzzahlen berechnet)?
  tools:
  - run_sql
  setup: *id001
  max_steps: 6
  meta:
    language: de
    schema_id: rett
    dataset: sid_srz_od1036_hilfsfristen_rettungsdienste_jahr_stadtkreis
    split: test
    group: sid
    template: citywide_15
  checks:
  - type: sql_result_match
    gold: SELECT ROUND(100.0 * SUM(Anzahl_Einsaetze_bis_15min) / (SUM(Anzahl_Einsaetze_bis_15min) + SUM(Anzahl_Einsaetze_groesser_15min)), 1) FROM rettungsdienst_hilfsfristen WHERE Jahr = 2013
  - type: final_number
    value: 95.9
    tol: 0.06
