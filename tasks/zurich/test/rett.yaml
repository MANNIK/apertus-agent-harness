  - run_sql
  setup: *id001
  max_steps: 6
  meta:
    language: en
    schema_id: rett
    dataset: sid_srz_od1036_hilfsfristen_rettungsdienste_jahr_stadtkreis
    split: test
    group: sid
    template: kreise_above
  checks:
  - type: sql_result_match
    gold: SELECT COUNT(*) FROM rettungsdienst_hilfsfristen WHERE Jahr = 2016 AND Prozent_Einsaetze_bis_10min >= 70
  - type: final_number
    value: 9.0
    tol: 0.0
