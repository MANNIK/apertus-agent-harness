- id: rett_slowest_1
  category: argmax
  prompt: Dans quel arrondissement le délai d'intervention médian du service de sauvetage était-il le plus long en 2025 ?
  tools:
  - run_sql
  setup: *id001
  max_steps: 6
  meta:
    language: fr
    schema_id: rett
    dataset: sid_srz_od1036_hilfsfristen_rettungsdienste_jahr_stadtkreis
    split: test
    group: sid
    template: slowest
  checks:
  - type: sql_result_match
    gold: SELECT Stadtkreis FROM rettungsdienst_hilfsfristen WHERE Jahr = 2025 ORDER BY Hilfsfrist_Median DESC, Stadtkreis LIMIT 1
