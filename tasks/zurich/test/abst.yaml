    gold: SELECT Name_Wahlkreis_StZH FROM abstimmungen WHERE Name_Politische_Ebene = 'Eidgenossenschaft' AND Name_Resultat_Gebiet = 'Stadt Zürich' AND Abstimmungs_Datum = '2009-02-28' AND Name_Wahlkreis_StZH IS NOT NULL ORDER BY Ja_Prozent DESC, Name_Wahlkreis_StZH LIMIT 1
