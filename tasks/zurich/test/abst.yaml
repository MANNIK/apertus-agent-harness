# GENERATO da scripts/build_zurich_tasks.py: non modificare a mano (le modifiche vanno nelle specifiche e si rigenera).
# Schema abst, split test. Dati reali CC0 della Città di Zurigo (data/zurich/, vedi docs/dati.md).
# Domande e query gold scritte da Claude (strumento di sviluppo), verificate eseguendo il gold; formulazioni NON riviste da madrelingua.
- id: abst_n_federal_1
  category: aggregation
  prompt: Su quanti oggetti federali si è votato il 09.02.2014?
  tools:
  - run_sql
  setup: &id001
    sql_init:
    - CREATE TABLE abstimmungen AS SELECT * FROM read_csv('{DATA}/zurich/politik_abstimmungen_seit1933.csv', header=true, sample_size=-1)
  max_steps: 6
  meta:
    language: it
    schema_id: abst
    dataset: politik_abstimmungen_seit1933
    split: test
    group: politik
    template: n_federal
  checks:
  - type: sql_result_match
    gold: SELECT COUNT(DISTINCT Abstimmungs_Text) FROM abstimmungen WHERE Name_Politische_Ebene = 'Eidgenossenschaft' AND Name_Resultat_Gebiet = 'Eidgenossenschaft' AND Abstimmungs_Datum = '2014-02-09'
  - type: sql_result_projection
    gold: SELECT COUNT(DISTINCT Abstimmungs_Text) FROM abstimmungen WHERE Name_Politische_Ebene = 'Eidgenossenschaft' AND Name_Resultat_Gebiet = 'Eidgenossenschaft' AND Abstimmungs_Datum = '2014-02-09'
    diagnostic: true
  - type: final_number
    value: 3.0
    tol: 0.0
    diagnostic: true
