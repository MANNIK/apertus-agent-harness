- id: abst_busy_dates_1
  category: subquery
  prompt: In quante date di votazione nel 2026 si è votato su almeno 3 oggetti federali?
  tools:
  - run_sql
  setup: *id001
  max_steps: 6
  meta:
    language: it
    schema_id: abst
    dataset: politik_abstimmungen_seit1933
    split: test
    group: politik
    template: busy_dates
  checks:
  - type: sql_result_match
    gold: SELECT COUNT(*) FROM (SELECT Abstimmungs_Datum FROM abstimmungen WHERE Name_Politische_Ebene = 'Eidgenossenschaft' AND Name_Resultat_Gebiet = 'Eidgenossenschaft' AND year(Abstimmungs_Datum) = 2026 GROUP BY Abstimmungs_Datum HAVING COUNT(DISTINCT Abstimmungs_Text) >= 3)
  - type: sql_result_projection
    gold: SELECT COUNT(*) FROM (SELECT Abstimmungs_Datum FROM abstimmungen WHERE Name_Politische_Ebene = 'Eidgenossenschaft' AND Name_Resultat_Gebiet = 'Eidgenossenschaft' AND year(Abstimmungs_Datum) = 2026 GROUP BY Abstimmungs_Datum HAVING COUNT(DISTINCT Abstimmungs_Text) >= 3)
    diagnostic: true
  - type: final_number
    value: 1.0
    tol: 0.0
    diagnostic: true
