# GENERATO da scripts/build_zurich_tasks.py: non modificare a mano (le modifiche vanno nelle specifiche e si rigenera).
# Schema feue, split test. Dati reali CC0 della Città di Zurigo (data/zurich/, vedi docs/dati.md).
# Domande e query gold scritte da Claude (strumento di sviluppo), verificate eseguendo il gold; formulazioni NON riviste da madrelingua.
- id: feue_missions_1
  category: aggregation
  prompt: How many fire-brigade call-outs were there in total in 2013 in Kreis 3 (all response-time categories combined)?
  tools:
  - run_sql
  setup: &id001
    sql_init:
    - CREATE TABLE feuerwehr_ausrueckzeit AS SELECT * FROM read_csv('{DATA}/zurich/sid_srz_od1027_feuerwehr_ausrueckzeit_jahr_stadtkreis.csv', header=true, sample_size=-1)
  max_steps: 6
  meta:
    language: en
    schema_id: feue
    dataset: sid_srz_od1027_feuerwehr_ausrueckzeit_jahr_stadtkreis
    split: test
    group: sid
    template: missions
  checks:
  - type: sql_result_match
    gold: SELECT Anzahl_Einsaetze_bis_10min + Anzahl_Einsaetze_groesser_10min FROM feuerwehr_ausrueckzeit WHERE Stadtkreis = 'Kreis 3' AND Jahr = 2013
  - type: final_number
    value: 180.0
    tol: 0.0
