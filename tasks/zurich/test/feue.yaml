- id: feue_citywide_share_1
  category: arithmetic
  prompt: Quelle était en 2020 à l'échelle de la ville la part des interventions avec un temps de sortie jusqu'à 10 minutes, en pourcentage arrondi à une décimale (calculée à partir du nombre d'interventions) ?
  tools:
  - run_sql
  setup: *id001
  max_steps: 6
  meta:
    language: fr
    schema_id: feue
    dataset: sid_srz_od1027_feuerwehr_ausrueckzeit_jahr_stadtkreis
    split: test
    group: sid
    template: citywide_share
  checks:
  - type: sql_result_match
    gold: SELECT ROUND(100.0 * SUM(Anzahl_Einsaetze_bis_10min) / (SUM(Anzahl_Einsaetze_bis_10min) + SUM(Anzahl_Einsaetze_groesser_10min)), 1) FROM feuerwehr_ausrueckzeit WHERE Jahr = 2020
  - type: final_number
    value: 85.1
    tol: 0.06
