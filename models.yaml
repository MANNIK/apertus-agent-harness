# Registro dei modelli del progetto: è la fonte unica per il report tecnico (regola 6 del hackathon:
# "ogni modello usato, in sviluppo e a runtime, con versione e ruolo") e per i controlli di
# conformità (`agentbench compliance`). Aggiornalo ogni volta che usi un modello nuovo.
#
# stages: in quale fase il modello viene usato
#   development = per costruire la soluzione (regola 2: qui è permesso qualsiasi modello, anche chiuso)
#   runtime     = dentro la soluzione finale (regola 3: solo Apertus e modelli open-weights)
#   evaluation  = per valutare, anche come giudice automatico (regola 4: solo open-weights)
# match: frammenti del nome del modello (campo `model` delle run) che identificano questa voce (per sottostringa).
#   Il campo `id` vale invece solo per corrispondenza esatta: le voci dei modelli ospitati (es. apertus-v1-5-8b)
#   non usano `match`, così `apertus-v1-5-8b-thinking` NON viene scambiato per `apertus-v1-5-8b`.

deployment:
  # Regola 5: scegliere UNA architettura target tra  on-premise | air-gapped | sovereign-swiss-cloud
  target: null
  notes: "Da decidere con gli organizzatori; l'air-gapped è il caso più restrittivo."
  # Host non locali ammessi come endpoint (corrispondenza ESATTA del nome host, non per sottostringa).
  # gateway.keera.ch = gateway ufficiale dell'hackathon (CSCS tramite Keera), cloud sovrano svizzero (regola 5),
  # indicato nella pagina "Resources & Tools". Questo elenco non sceglie l'architettura target.
  allowed_endpoint_hosts:
    - gateway.keera.ch

models:
  - id: apertus-v1.5-8b-mlx-bf16
    name: "Apertus v1.5 8B Instruct, MLX bf16 conversion (tokimoa)"
    match: ["apertus-v1.5-8b-mlx-bf16", "Apertus-v1.5-8B"]
    version: "swiss-ai/Apertus-v1.5-8B; conversion tokimoa/apertus-v1.5-8b-mlx-bf16, commit 085831737782"
    license: "Apache-2.0 (Apertus); license of the third-party conversion: to be verified"
    open_weights: true
    stages: [development, evaluation]
    role: "Model under test and base of the modified checkpoints: writes SQL (read-only DuckDB tool) for questions about Swiss open data in DE/FR/IT/EN. Original-weights condition of the comparison original / WSP / LoRA."

  - id: claude-sonnet-5-5
    name: "Claude Sonnet 5.5 (Anthropic), used through Claude Code"
    match: []
    version: "claude-sonnet-5-5"
    license: "proprietary (closed model)"
    open_weights: false
    stages: [development]
    role: "Coding assistant (rule 2): development of the harness, drafting of the dataset (question templates in DE/FR/IT/EN and gold SQL, all executed and checked by code), analysis of results, documentation, and design of the weight modifications (WSP) once they exist. Not used at runtime nor as a judge in evaluations."

  - id: demo-oracle-synthetic
    name: "Synthetic script for the demo (no real model)"
    match: ["demo-oracle-synthetic"]
    version: "scripts/build_demo_sql.py"
    license: "Apache-2.0 (project code)"
    open_weights: true
    stages: [development]
    role: "Fake server that runs the gold query of each synthetic task: only used to verify the harness (make demo). It is not Apertus and produces no research results."

  # Modelli ospitati dal gateway ufficiale (gateway.keera.ch). Gli id sono i nomi esposti dall'API.
  - id: apertus-v1-5-8b
    name: "Apertus v1.5 8B, served by the CSCS/Keera gateway"
    match: []
    version: "swiss-ai/Apertus-v1.5-8B (official weights; exact version served by the gateway: to be verified)"
    license: "Apache-2.0 (Apertus; as in the MLX entry above, gateway model card not checked)"
    open_weights: true
    stages: [development, evaluation]
    role: "Original-weights model under test via the official API (available from 27 November 08:00): Text-to-SQL on Swiss open data. Serves only the official weights, not the modified ones."

  - id: apertus-v1-5-70b
    name: "Apertus v1.5 70B, served by the CSCS/Keera gateway"
    match: []
    version: "swiss-ai/Apertus-v1.5-70B (official weights; exact version served by the gateway: to be verified)"
    license: "to be verified"
    open_weights: true
    stages: [development, evaluation]
    role: "Original-weights model under test via the official API (large variant), optional reference: Text-to-SQL on Swiss open data."
