[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apertus-agent-harness"
version = "0.1.0"
description = "Harness per valutare il comportamento agentico (tool calling) di modelli serviti via API OpenAI-compatibile, pensato per Apertus."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx>=0.27",   # BSD-3-Clause
    "pyyaml>=6",     # MIT
]

[project.optional-dependencies]
dev = ["pytest>=8"]  # MIT
mlx = ["mlx-lm>=0.27; sys_platform == 'darwin'"]  # MIT; serve solo per avviare il server in locale su Mac
wsp = ["numpy>=1.26", "ml_dtypes>=0.4", "safetensors>=0.4"]  # BSD-3 / Apache-2.0 / Apache-2.0 (letti dai METADATA installati); strumenti sui pesi (wsp.py), mai importati dal resto del pacchetto
sql = ["duckdb>=1.0"]  # MIT (da riconfermare dal METADATA installato, vedi docs/dati.md); motore SQL locale per il Text-to-SQL

[project.scripts]
agentbench = "agentbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
