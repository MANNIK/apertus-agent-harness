[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apertus-agent-harness"
version = "0.1.0"
description = "Harness per valutare il comportamento agentico (tool calling) di modelli serviti via API OpenAI-compatibile, pensato per Apertus."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx>=0.27",   # BSD-3-Clause
    "pyyaml>=6",     # MIT
]

[project.optional-dependencies]
dev = ["pytest>=8"]  # MIT
mlx = ["mlx-lm>=0.27; sys_platform == 'darwin'"]  # MIT; serve solo per avviare il server in locale su Mac

[project.scripts]
agentbench = "agentbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
